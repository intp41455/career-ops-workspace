<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 转型作战台 · Career Ops Workspace</title>
<style>
/* ============================================================
   设计系统 · ADHD / INTP 取向
   原则：低装饰噪音 · 单一强调色 · 等宽数字 · 一屏一焦点 · 即时状态
   ============================================================ */
:root{
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:8px; --r-s:6px; --r-xs:4px;
  --ease:cubic-bezier(.4,0,.2,1);
}
/* ---------- 暗色（默认）---------- */
body[data-theme="dark"]{
  --bg:#0A0C10; --card:#12161B; --card-2:#171C23; --card-3:#1D232B;
  --ink:#E9EDF3; --ink-2:#98A3B3; --ink-3:#687385;
  --line:#232A33; --line-2:#1A2028;
  --acc:#2DD4BF; --acc-2:#5EEAD4; --acc-ink:#05231F;
  --acc-bg:rgba(45,212,191,.10); --acc-bd:rgba(45,212,191,.28);
  --bad:#F87171;  --bad-bg:rgba(248,113,113,.11); --bad-bd:rgba(248,113,113,.30);
  --warn:#FBBF24; --warn-bg:rgba(251,191,36,.11);  --warn-bd:rgba(251,191,36,.28);
  --ok:#4ADE80;   --ok-bg:rgba(74,222,128,.10);    --ok-bd:rgba(74,222,128,.26);
  --info:#60A5FA; --info-bg:rgba(96,165,250,.10);  --info-bd:rgba(96,165,250,.26);
  --purple:#A78BFA; --purple-bg:rgba(167,139,250,.10); --purple-bd:rgba(167,139,250,.26);
  --dot:rgba(255,255,255,.035);
  --sh:0 1px 2px rgba(0,0,0,.35);
  --sh-h:0 0 0 1px var(--acc-bd),0 10px 30px rgba(0,0,0,.5);
  --topbar:rgba(10,12,16,.78);
  --mobtab:rgba(18,22,27,.95);
  --sel:rgba(45,212,191,.26);
  --cv-dot:rgba(255,255,255,.055); --cv-edge:#3A434F;
  --cv-leaf:#171C23; --cv-leaf-ink:#AEBBCC; --cv-hint:rgba(18,22,27,.92);
  --cv-shadow:#000000;
  color-scheme:dark;
}
/* ---------- 亮色 ---------- */
body[data-theme="light"]{
  --bg:#F5F7F9; --card:#FFFFFF; --card-2:#FAFBFC; --card-3:#F1F4F7;
  --ink:#0D1117; --ink-2:#4B5563; --ink-3:#8A94A6;
  --line:#E1E6EC; --line-2:#EDF0F4;
  --acc:#0D9488; --acc-2:#14B8A6; --acc-ink:#FFFFFF;
  --acc-bg:#E7F6F4; --acc-bd:#B3E2DC;
  --bad:#DC2626;  --bad-bg:#FEF2F2;  --bad-bd:#F6CFCF;
  --warn:#B45309; --warn-bg:#FEF7E8; --warn-bd:#F2DFB4;
  --ok:#15803D;   --ok-bg:#EDF9F1;   --ok-bd:#C6E9D3;
  --info:#1D4ED8; --info-bg:#EFF4FE; --info-bd:#C9D8F7;
  --purple:#7C3AED; --purple-bg:#F5F1FE; --purple-bd:#DDD0FA;
  --dot:rgba(13,17,23,.05);
  --sh:0 1px 2px rgba(13,17,23,.04),0 3px 10px rgba(13,17,23,.045);
  --sh-h:0 0 0 1px var(--acc-bd),0 10px 26px rgba(13,17,23,.10);
  --topbar:rgba(245,247,249,.82);
  --mobtab:rgba(255,255,255,.96);
  --sel:rgba(13,148,136,.18);
  --cv-dot:#DED7D1; --cv-edge:#C9BEB6;
  --cv-leaf:#FFFFFF; --cv-leaf-ink:#5A514A; --cv-hint:rgba(255,255,255,.9);
  --cv-shadow:#1F1B18;
  color-scheme:light;
}
/* 旧令牌别名（保持既有内联样式零改动仍生效） */
body{ --pri:var(--acc); --pri-l:var(--acc-2); --pri-bg:var(--acc-bg); --pri-bd:var(--acc-bd); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  font-size:14.5px;line-height:1.62;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  background-image:radial-gradient(var(--dot) 1px,transparent 0);
  background-size:22px 22px;background-attachment:fixed;
  transition:background-color .25s var(--ease),color .25s var(--ease);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--acc)}
::selection{background:var(--sel)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:222px;flex:0 0 222px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:16px 16px 13px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:center}
.logo{
  width:30px;height:30px;flex:0 0 30px;border-radius:var(--r-s);
  background:linear-gradient(140deg,var(--acc),var(--acc-2));display:grid;place-items:center;
}
.logo svg{width:17px;height:17px;stroke:var(--acc-ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand h1{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.2px;line-height:1.25}
.brand p{margin:2px 0 0;font-size:10.5px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.1px}
.nav{padding:9px 9px;flex:1;overflow-y:auto}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;margin-bottom:1px;
  border-radius:var(--r-s);font-size:13px;color:var(--ink-2);text-align:left;
  transition:background .15s var(--ease),color .15s var(--ease);position:relative;
}
.nav button svg{width:15px;height:15px;flex:0 0 15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--card-3);color:var(--ink)}
.nav button.on{background:var(--acc-bg);color:var(--acc);font-weight:600}
.nav button.on::before{content:'';position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:2.5px;height:16px;border-radius:0 3px 3px 0;background:var(--acc)}
.nav button .nb{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink-3);
  background:var(--card-3);padding:1px 6px;border-radius:20px}
.nav button.on .nb{background:var(--acc);color:var(--acc-ink)}
.nav .sec{padding:13px 10px 5px;font-size:10px;color:var(--ink-3);letter-spacing:1px;font-weight:600;text-transform:uppercase}
.sidebar-foot{padding:10px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:7px}
.sync{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3);padding:0 3px;font-family:var(--mono)}
.sync .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 6px;box-shadow:0 0 0 3px var(--ok-bg)}
.sync.busy .dot{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.sync.off .dot{background:var(--ink-3);box-shadow:none}
.mini{display:flex;gap:6px}
.mini button{
  flex:1;padding:7px 4px;border:1px solid var(--line);border-radius:var(--r-s);
  font-size:11px;color:var(--ink-2);background:var(--card);transition:.15s var(--ease);
}
.mini button:hover{border-color:var(--acc-bd);color:var(--acc);background:var(--acc-bg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--topbar);backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line);padding:11px 26px;display:flex;align-items:center;gap:14px;
}
.topbar h2{margin:0;font-size:16px;font-weight:660;letter-spacing:-.25px;line-height:1.3}
.topbar .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;font-family:var(--mono)}
.topbar .sp{flex:1}
.btn{
  padding:7px 13px;border-radius:var(--r-s);font-size:12.5px;font-weight:560;
  background:var(--acc);color:var(--acc-ink);transition:.15s var(--ease);white-space:nowrap;
}
.btn:hover{background:var(--acc-2)}
.btn.ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--acc-bd);color:var(--acc);background:var(--acc-bg)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.view{padding:20px 26px 80px;max-width:1240px;width:100%}
.view[hidden]{display:none}

/* ============ 卡片 ============ */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:15px 17px;margin-bottom:12px;
  transition:border-color .18s var(--ease);
}
.card:hover{border-color:var(--line-2)}
.card-h{display:flex;align-items:center;gap:9px;margin:0 0 12px}
.card-h h3{margin:0;font-size:14px;font-weight:640;letter-spacing:-.15px}
.card-h .sp{flex:1}
.card-h .tag{font-size:10.5px;color:var(--ink-3);background:var(--card-3);padding:2px 8px;border-radius:20px;font-family:var(--mono)}
.grid{display:grid;gap:12px}

/* 今日焦点条 —— 一屏一焦点 */
.focus{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px 16px 21px;margin-bottom:12px;box-shadow:var(--sh);overflow:hidden;
}
.focus::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.focus.warn::before{background:var(--warn)}
.focus.bad::before{background:var(--bad)}
.focus-l{font-size:10.5px;letter-spacing:1.1px;font-weight:650;color:var(--acc);text-transform:uppercase;font-family:var(--mono)}
.focus.warn .focus-l{color:var(--warn)}
.focus.bad .focus-l{color:var(--bad)}
.focus-t{font-size:19px;font-weight:660;letter-spacing:-.4px;line-height:1.35;margin:5px 0 4px}
.focus-m{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.focus-act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* 告警区 */
.g-alert{background:var(--bad-bg);border:1px solid var(--bad-bd);border-radius:var(--r);padding:13px 15px;margin-bottom:12px}
.g-alert h4{margin:0 0 9px;font-size:12.5px;color:var(--bad);display:flex;align-items:center;gap:6px;font-weight:650}
.g-alert h4 svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.alert-row{
  display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card);
  border-radius:var(--r-s);margin-bottom:5px;border:1px solid var(--line);border-left:2.5px solid var(--bad);
}
.alert-row:last-child{margin-bottom:0}
.alert-row .t{flex:1;min-width:0;font-size:12.5px}
.alert-row .t b{font-weight:600}
.alert-row .m{font-size:10.5px;color:var(--ink-3);margin-top:1px;font-family:var(--mono)}

/* ============ 标签 ============ */
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:1.5px 7px;border-radius:var(--r-xs);
  font-size:10px;font-weight:640;letter-spacing:.25px;white-space:nowrap;
  font-family:var(--mono);border:1px solid transparent;
}
.chip.p0{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-bd)}
.chip.p1{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.chip.p2{background:var(--info-bg);color:var(--info);border-color:var(--info-bd)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.chip.grey{background:var(--card-3);color:var(--ink-3);border-color:var(--line)}
.chip.pur{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-bd)}
.chip.acc{background:var(--acc-bg);color:var(--acc);border-color:var(--acc-bd)}

.done-btn{
  width:24px;height:24px;flex:0 0 24px;border-radius:var(--r-xs);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;transition:.15s var(--ease);background:var(--card);
}
.done-btn svg{width:12px;height:12px;stroke:var(--ink-3);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.done-btn:hover{border-color:var(--ok);background:var(--ok-bg)}
.done-btn.on{background:var(--ok);border-color:var(--ok)}
.done-btn.on svg{stroke:#06210F;opacity:1}

/* ============ 统计（等宽大数字）============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-bottom:13px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.stat .l{font-size:10.5px;color:var(--ink-3);letter-spacing:.5px;font-weight:600;text-transform:uppercase}
.stat .v{font-size:26px;font-weight:660;letter-spacing:-1px;margin-top:2px;line-height:1.15;font-family:var(--mono)}
.stat .v small{font-size:11.5px;font-weight:500;color:var(--ink-3);margin-left:2px;font-family:var(--mono)}
.stat .b{margin-top:8px;height:3px;background:var(--card-3);border-radius:3px;overflow:hidden}
.stat .b i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .5s var(--ease)}

/* ============ 进度条 / 时间线 ============ */
.bar{height:4px;background:var(--card-3);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s var(--ease)}

/* ============ 看板 ============ */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(212px,1fr));gap:11px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px;box-shadow:var(--sh);min-height:130px}
.col-h{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.col-h .c-dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.col-h .c-t{font-size:12px;font-weight:650;letter-spacing:-.1px}
.col-h .c-n{font-size:10.5px;color:var(--ink-3);background:var(--card-3);padding:1px 7px;border-radius:20px;margin-left:auto;font-family:var(--mono)}
.kcard{
  background:var(--card-2);border:1px solid var(--line);border-left-width:2.5px;border-radius:var(--r-s);
  padding:9px 10px;margin-bottom:7px;cursor:grab;transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
}
.kcard:hover{box-shadow:var(--sh-h);border-color:var(--acc-bd)}
.kcard.dragging{opacity:.35}
.kcard .kt{font-size:12.5px;font-weight:600;line-height:1.45;margin-bottom:5px;letter-spacing:-.1px}
.kcard .km{font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--mono)}
.col.over{background:var(--acc-bg);border-color:var(--acc-bd)}

/* ============ 网格卡片（通用）============ */
.tile{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px}
.tile .k{font-size:10.5px;color:var(--ink-3);letter-spacing:.3px;font-weight:600}
.tile .v{font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.45}

/* ============ 可折叠 ============ */
details.acc{border:1px solid var(--line);border-radius:var(--r-s);background:var(--card-2);margin-bottom:8px;overflow:hidden}
details.acc>summary{
  padding:10px 13px;cursor:pointer;font-size:12.5px;font-weight:600;list-style:none;
  display:flex;align-items:center;gap:8px;transition:background .15s var(--ease);
}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:hover{background:var(--card-3)}
details.acc>summary .arw{margin-left:auto;font-family:var(--mono);color:var(--ink-3);font-size:11px;transition:transform .2s var(--ease)}
details.acc[open]>summary .arw{transform:rotate(90deg)}
details.acc>summary::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--acc);flex:0 0 3px}
details.acc .acc-b{padding:2px 13px 13px}

/* ============ 表格（JD 映射）============ */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{
  text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:650;
  color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.55}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--card-2)}

/* ============ 移动端 ============ */
.mobtab{display:none}
@media(max-width:900px){
  .sidebar{display:none}
  .kanban{grid-template-columns:1fr;gap:9px}
  .view{padding:14px 13px 100px}
  .topbar{padding:10px 13px}
  body{font-size:14px}
  .focus-t{font-size:17px}
  .stat .v{font-size:23px}
  .mobtab{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--mobtab);
    backdrop-filter:blur(14px) saturate(1.4);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mobtab{overflow-x:auto;scrollbar-width:none}
  .mobtab::-webkit-scrollbar{display:none}
  .mobtab button{
    flex:0 0 20%;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;
    font-size:9.5px;color:var(--ink-3);min-height:54px;justify-content:center;
  }
  .mobtab button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .mobtab button.on{color:var(--acc)}
  .tools{flex-wrap:wrap}
  .tbl{font-size:11.5px}
  .tbl th,.tbl td{padding:7px 6px}
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:99;
  background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:var(--r-s);font-size:12.5px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.22s var(--ease);
  font-family:var(--mono);
}
.toast.show{opacity:1;bottom:96px}
/* 主题切换 */
.tt{
  display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 4px;
  border:1px solid var(--line);border-radius:var(--r-s);font-size:11px;color:var(--ink-2);background:var(--card);
  transition:.15s var(--ease);width:100%;
}
.tt:hover{border-color:var(--acc-bd);color:var(--acc);background:var(--acc-bg)}
.tt svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ============ 窄屏表格 → 卡片 ============ */
@media(max-width:760px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%!important}
  .tbl tr{border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:8px;padding:9px 11px;background:var(--card-2)}
  .tbl td{border:none;padding:3px 0;font-size:12px}
  .tbl td[data-l]::before{content:attr(data-l);display:block;font-size:9.5px;letter-spacing:.7px;
    font-weight:650;color:var(--ink-3);text-transform:uppercase;margin-bottom:2px}
  .tbl td[data-l]{margin-top:6px}
}

/* ============ 脱敏演示声明 ============ */
.demo-badge{
  display:inline-flex;align-items:center;gap:3px;margin-top:3px;
  padding:1px 6px;border-radius:999px;font-size:9px;font-weight:650;letter-spacing:.4px;
  color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-bd);white-space:nowrap;
}
.demo-banner{
  display:flex;align-items:flex-start;gap:10px;
  margin:0 0 12px;padding:9px 13px;border-radius:var(--r-s);
  background:var(--warn-bg);border:1px solid var(--warn-bd);
}
.demo-banner .dm-ico{flex:0 0 auto;width:15px;height:15px;margin-top:1px;stroke:var(--warn);fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.demo-banner .dm-txt{flex:1;min-width:0;font-size:12px;line-height:1.65;color:var(--ink-2)}
.demo-banner b{color:var(--warn);font-weight:650}

<script>
/* =======================================================================
   数据层 —— 所有读写只在这里发生
   ======================================================================= */
const LS_KEY = 'career_ops_v1';

const DEFAULT_DATA = {
  version: 2,
  targets: [],   // 学习目标（看板）
  tasks: [],     // 今日待办
  plans: [],     // 21天计划
  resources: [], // 学习资料
  sprint: [],    // 投递冲刺 · 14 天补齐清单
  jdmap: [],     // JD 关键词映射
  canvas: { nodes: [], edges: [], view: { x: 0, y: 0, z: 1 } },
  skipExample: false
};

let state = JSON.parse(JSON.stringify(DEFAULT_DATA));

/* =====================================================================
   增量迁移（2026-09-14）
   浏览器里已存的数据不会因为代码更新而自动变化，这里显式补齐：
     ① 新增条目 → 追加（不覆盖用户已勾选的 done / status）
     ② 修订条目 → 按 id 覆盖文案字段，但保留用户的勾选状态
   ===================================================================== */
const RES_VERSION  = 2;   // 资源包版本
const GOAL_VERSION = 2;   // 目标包版本

/* 按 id 修订：只改展示文案，不改完成状态 */
const RES_UPDATES = {
  r6:  {title:'chatchat-space/Langchain-Chatchat（⚠️ 停更，只读思路）'},
  r17: {title:'vibrantlabsai/ragas（原 explodinggradients/ragas）', by:'RAGAS · ⚠️ 已改名易手', url:'https://github.com/vibrantlabsai/ragas'}
};

function migrate(){
  let dirty = false;

  /* 目标：追加新增 g13 */
  if(!state.goalVersion || state.goalVersion < GOAL_VERSION){
    const has = new Set((state.targets||[]).map(x=>x.id));
    GOALS_EXTRA_SEED().forEach(t=>{ if(!has.has(t.id)) state.targets.push(t); });
    state.goalVersion = GOAL_VERSION; dirty = true;
  }

  /* 资源：修订 + 追加 */
  if(!state.resVersion || state.resVersion < RES_VERSION){
    const seed = RES_SEED();
    const has  = new Set((state.resources||[]).map(x=>x.id));
    if(state.resources && state.resources.length){
      state.resources.forEach(r=>{
        const u = RES_UPDATES[r.id];
        if(u) Object.assign(r, u);          // 保留 done，只换文案
      });
    }
    seed.forEach(r=>{ if(!has.has(r.id)) state.resources.push(r); });
    state.resVersion = RES_VERSION; dirty = true;
  }

  if(dirty) saveData();
}

function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw){ state = seedData(); saveData(); return; }
    const p = JSON.parse(raw);
    state = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), p);
    if(!state.canvas || !state.canvas.nodes) state.canvas = { nodes:[], edges:[], view:{x:0,y:0,z:1} };
    /* 版本迁移：老数据补齐新增模块，绝不覆盖已有内容 */
    if(!state.sprint || !state.sprint.length) state.sprint = SPRINT_SEED();
    if(!state.jdmap || !state.jdmap.length) state.jdmap = JDMAP_SEED();
    migrate();
  }catch(e){
    state = seedData();
  }
}

let saveTimer = null;
function saveData(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    flashSync('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>flashSync('ok'), 550);
  }catch(e){ flashSync('off'); }
}

function flashSync(mode){
  const box = document.getElementById('syncBox');
  const txt = document.getElementById('syncTxt');
  if(!box) return;
  box.className = 'sync' + (mode==='saving' ? ' busy' : mode==='off' ? ' off' : '');
  txt.textContent = mode==='saving' ? '本地存储 · 保存中'
                 : mode==='off'    ? '离线模式 · 请导出备份'
                 : '本地模式 · 已就绪';
}

/* ---------- 日期工具（DAG 中最底层，无依赖） ---------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateAdd(baseStr, days){
  const [y,m,d] = baseStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+days);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function daysBetween(a,b){
  const pa=a.split('-').map(Number), pb=b.split('-').map(Number);
  return Math.round((new Date(pb[0],pb[1]-1,pb[2]) - new Date(pa[0],pa[1]-1,pa[2]))/86400000);
}
function fmtMD(s){
  if(!s) return '';
  const [,m,d] = s.split('-');
  return Number(m)+'月'+Number(d)+'日';
}

   ======================================================================= */
function collectAlerts(){
  const t = todayStr();
  const out = [];
  // 逾期目标
  state.targets.forEach(g=>{
    if(g.status==='done' || !g.due) return;
    const d = daysBetween(t, g.due);
    if(d < 0) out.push({kind:'target', id:g.id, title:g.title, meta:'目标逾期 '+(-d)+' 天 · '+g.stage, level:'bad', tag:g.pri});
    else if(d === 0) out.push({kind:'target', id:g.id, title:g.title, meta:'今天到期 · '+g.stage, level:'warn', tag:g.pri});
    else if(d <= 2) out.push({kind:'target', id:g.id, title:g.title, meta:d+' 天后到期 · '+g.stage, level:'warn', tag:g.pri});
  });
  // 逾期任务
  state.tasks.forEach(k=>{
    if(k.status==='done' || !k.due) return;
    const d = daysBetween(t, k.due);
    if(d < 0) out.push({kind:'task', id:k.id, title:k.title, meta:'待办逾期 '+(-d)+' 天 · '+k.src, level:'bad', tag:k.pri});
    else if(d === 0) out.push({kind:'task', id:k.id, title:k.title, meta:'今天要做 · '+k.src, level:'warn', tag:k.pri});
  });
  const order = {bad:0, warn:1};
  out.sort((a,b)=> order[a.level]-order[b.level]);
  return out;
}

/* ---------- 今日唯一焦点（ADHD 友好：一屏只给一个动作） ---------- */
function pickFocus(){
  const alerts = collectAlerts();
  const bad = alerts.find(a=>a.level==='bad');
  if(bad) return {level:'bad', label:'先清掉这条逾期的', title:bad.title, meta:bad.meta, kind:bad.kind, id:bad.id};
  const sp = (state.sprint||[]).find(x=>!x.done);
  if(sp) return {level:'norm', label:'今日冲刺产出物 · '+sp.day, title:sp.out,
                 meta:sp.title+' · 预计 '+sp.hours+' · 截止 '+fmtMD(sp.due), sprintId:sp.id};
  if(alerts.length) return {level:'warn', label:'今天到期', title:alerts[0].title, meta:alerts[0].meta,
                            kind:alerts[0].kind, id:alerts[0].id};
  return null;
}

function bindKanbanDnD(){
  let dragId = null;
  $$('#kanban .kcard').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      dragId = card.dataset.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', dragId); }catch(_){}
    });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging');
      $$('#kanban .col').forEach(c=>c.classList.remove('over'));
      dragId = null;
    });
  });
  $$('#kanban .col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; col.classList.add('over'); });
    col.addEventListener('dragleave', ()=>col.classList.remove('over'));
    col.addEventListener('drop', e=>{
      e.preventDefault();
      col.classList.remove('over');
      const id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
      if(!id) return;
      moveTarget(id, col.dataset.col);
    });
  });
}

/* =======================================================================
   模块 5 · 无限画布（网状思维图 / 流程图 / 框图）
   ======================================================================= */
const PALETTE = ['#993C1D','#2C6E9B','#2F855A','#6B46C1','#B7791F','#0E7490'];
/* 暗色主题下同序号的高亮版（浅底改深底，颜色整体提亮） */
const PALETTE_DK = ['#F07C5A','#63A9E8','#5FCB8C','#A78BFA','#E0B24C','#3EC6D8'];
function cvColor(n){
  const i = (n.color||0) % PALETTE.length;
  return document.body.dataset.theme === 'light' ? PALETTE[i] : PALETTE_DK[i];
}
/* 文本宽度估算（中文按 1em、拉丁按 0.55em），用于节点自适应与截断 */
function cvTextW(s, size){
  let w = 0;
  for(const ch of String(s)){
    const c = ch.codePointAt(0);
    const wide = (c>=0x1100&&c<=0x115F)||(c>=0x2E80&&c<=0xA4CF)||(c>=0xAC00&&c<=0xD7A3)
              ||(c>=0xF900&&c<=0xFAFF)||(c>=0xFE30&&c<=0xFE4F)||(c>=0xFF00&&c<=0xFF60)||(c>=0xFFE0&&c<=0xFFE6);
    w += wide ? size : size*0.55;
  }
  return w;
}
/* 贪心折行：拉丁词整体不拆，中日韩逐字可断 */
function cvWrap(text, maxW, size){
  const out = [];
  String(text).split('\n').forEach(seg=>{
    seg = seg.replace(/\s+$/,'');
    if(!seg){ out.push(''); return; }
    const toks = []; let buf = '';
    for(const ch of seg){
      if(/[A-Za-z0-9]/.test(ch) || (buf && /[._+\-#/@%&:·–—→()]/.test(ch))) buf += ch;
      else { if(buf){ toks.push(buf); buf = ''; } toks.push(ch); }
    }
    if(buf) toks.push(buf);
    let line = '';
    toks.forEach(tk=>{
      if(line && cvTextW(line+tk, size) > maxW){ out.push(line); line = (tk === ' ' ? '' : tk); }
      else line += tk;
    });
    out.push(line);
  });
  return out.length ? out : [''];
}
/* 统一的节点度量出口：宽度 → 折行 → 高度。cvPaint / cvPath / cvBuildSVG 共用同一结果 */
const CV_LINE_CACHE = new Map();
function cvMetrics(n){
  const size = 12.5;
  const raw = String(n.text).split('\n');
  let w = n.w;
  if(!w){
    const need = Math.max(...raw.map(l=>cvTextW(l, size))) + 30;
    w = Math.max(140, Math.min(260, need));
  }
  const key = n.id + '|' + w + '|' + n.text;
  let lines = CV_LINE_CACHE.get(key);
  if(!lines){
    lines = cvWrap(String(n.text), w - 30, size);
    if(lines.length > 6){ lines = lines.slice(0,6); lines[5] = lines[5].replace(/.{1}$/,'…'); }
    CV_LINE_CACHE.set(key, lines);
  }
  return { w, h: 30 + lines.length*20, lines };
}
const CV = { scale:1, tx:0, ty:0, drag:null, panning:false, panStart:null, sel:null, mode:'mind' };

function cvNodeById(id){ return state.canvas.nodes.find(n=>n.id===id); }

function cvEdgesOf(id){
  return state.canvas.edges.filter(e=>e[0]===id||e[1]===id);
}

/* 自动布局：分层（BFS 深度 → 列，同层纵向均分） */
function layoutAuto(){
  const nodes = state.canvas.nodes;
  if(!nodes.length) return;

  /* --- 1) 有向分层：Kahn 拓扑 + 最长路径。只沿 a→b 方向推进，绝不回推父节点 --- */
  const adj = {}, indeg = {};
  nodes.forEach(n=>{ adj[n.id] = []; indeg[n.id] = 0; });
  state.canvas.edges.forEach(e=>{ if(adj[e[0]] && indeg[e[1]]!=null){ adj[e[0]].push(e[1]); indeg[e[1]]++; } });
  const depth = {}; nodes.forEach(n=>depth[n.id]=0);
  let q = nodes.filter(n=>indeg[n.id]===0).map(n=>n.id);
  if(!q.length) q = [nodes[0].id];
  const pending = Object.assign({}, indeg);
  while(q.length){
    const cur = q.shift();
    (adj[cur]||[]).forEach(nxt=>{
      if(depth[nxt] < depth[cur]+1) depth[nxt] = depth[cur]+1;
      if(--pending[nxt] === 0) q.push(nxt);
    });
  }

  /* --- 2) 同层按「父节点」分组成子列：同一父节点的子节点排在同一条竖列 --- */
  const COL_W = 300, SUB_W = 236, GAP_Y = 24, ROWS_MAX = 8;
  const byDepth = {};
  nodes.forEach(n=>{ const d=depth[n.id]; (byDepth[d]=byDepth[d]||[]).push(n); });
  Object.keys(byDepth).sort((a,b)=>a-b).forEach(d=>{
    const arr = byDepth[d];
    const bucket = [], keyOf = {};
    arr.forEach(n=>{
      let pid = null;
      state.canvas.edges.forEach(e=>{ if(pid===null && e[1]===n.id) pid = e[0]; });
      const k = (pid===null ? 'solo:'+n.id : pid);
      if(!keyOf[k]){ keyOf[k] = []; bucket.push(keyOf[k]); }
      keyOf[k].push(n);
    });
    const groups = [];
    bucket.forEach(g=>{
      if(g.length <= ROWS_MAX) groups.push(g);
      else for(let i=0;i<g.length;i+=ROWS_MAX) groups.push(g.slice(i,i+ROWS_MAX));
    });
    /* --- 3) 子列内按各节点实际高度紧凑堆叠，纵向居中 --- */
    groups.forEach((grp, gi)=>{
      const hs = grp.map(n=>cvNodeSize(n).h);
      const totalH = hs.reduce((a,b)=>a+b,0) + (grp.length-1)*GAP_Y;
      let cy = 300 - totalH/2;
      grp.forEach((n,i)=>{
        n.x = 60 + Number(d)*COL_W + gi*SUB_W;
        n.y = cy;
        cy += hs[i] + GAP_Y;
      });
    });
  });
}

function cvNodeSize(n){
  const m = cvMetrics(n);
  return {w:m.w, h:m.h};
}

function cvPath(a, b){
  const A = cvNodeSize(a), B = cvNodeSize(b);
  const ax = a.x + A.w, ay = a.y + A.h/2;
  const bx = b.x, by = b.y + B.h/2;
  const dx = Math.max(36, Math.abs(bx-ax)*0.45);
  return `M${ax} ${ay} C${ax+dx} ${ay}, ${bx-dx} ${by}, ${bx} ${by}`;
}

      <button class="btn ghost sm" data-act="genFlow">求职流程框图</button>
      <button class="btn ghost sm" data-act="genFromPlan">由 21 天计划生成全图</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden;position:relative">
    <div id="cvWrap" style="position:relative;width:100%;height:min(66vh,620px);background:
      radial-gradient(circle at 1px 1px, var(--cv-dot) 1px, transparent 0) 0 0/22px 22px, var(--bg);
      cursor:grab;overflow:hidden;touch-action:none">
      <svg id="cvSvg" width="100%" height="100%" style="display:block"><g id="cvG"></g></svg>
      <div id="cvHint" style="position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--ink-2);
        background:var(--cv-hint);padding:4px 9px;border-radius:7px;border:1px solid var(--line)"></div>
      <div style="position:absolute;right:12px;bottom:10px;display:flex;gap:6px">
        <button class="btn ghost sm" data-act="zin">＋</button>
        <button class="btn ghost sm" data-act="zout">－</button>
        <button class="btn ghost sm" data-act="zreset" title="恢复到 100% 并居中">重置</button>
      </div>
    </div>
  </div></div>`;
  el.innerHTML = h;
  cvBind();
  cvPaint();
}

function cvPaint(){
  const g = document.getElementById('cvG');
  if(!g) return;
  g.setAttribute('transform', `translate(${CV.tx},${CV.ty}) scale(${CV.scale})`);
  const idMap = {}; state.canvas.nodes.forEach(n=>idMap[n.id]=n);

  let html = '';
  /* 连线 */
  state.canvas.edges.forEach((e,idx)=>{
    const a = idMap[e[0]], b = idMap[e[1]];
    if(!a||!b) return;
    html += `<path d="${cvPath(a,b)}" style="fill:none;stroke:var(--cv-edge)" stroke-width="1.8" marker-end="url(#arw)"/>`;
  });
  /* 节点 */
  state.canvas.nodes.forEach(n=>{
    const s = cvNodeSize(n);
    const c = cvColor(n);
    const isRoot = n.type==='root';
    const isLeaf = n.type==='leaf';
    const alpha = document.body.dataset.theme === 'light' ? '14' : '24';
    const fill = isRoot ? c : (isLeaf ? 'var(--cv-leaf)' : c+alpha);
    const stroke = c;
    const lines = cvMetrics(n).lines;
    html += `<g class="cvn" data-id="${n.id}" style="cursor:grab">
      <rect x="${n.x}" y="${n.y}" width="${s.w}" height="${s.h}" rx="${isRoot?12:9}"
        style="fill:${fill};stroke:${stroke}" stroke-width="${isRoot?2:1.5}"
        ${isRoot?'':'filter="url(#soft)"'}/>
      ${lines.map((l,i)=>{
        if(i===0) return `<text x="${n.x+15}" y="${n.y+21}" font-size="12.5" font-weight="${isRoot||!isLeaf?650:500}"
          style="fill:${isRoot?'#FFFFFF':c}" font-family="inherit">${esc(l)}</text>`;
        return `<text x="${n.x+15}" y="${n.y+21+i*19}" font-size="11.5" style="fill:${isRoot?'#FFFFFF':'var(--cv-leaf-ink)'};opacity:${isRoot?0.88:1}" font-family="inherit">${esc(l)}</text>`;
      }).join('')}
    </g>`;
  });

  g.innerHTML = `<defs>
      <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" style="fill:var(--cv-edge)"/></marker>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="1" stdDeviation="1.6" style="flood-color:var(--cv-shadow)" flood-opacity="0.18"/></filter>
    </defs>` + html;

  const hint = document.getElementById('cvHint');
  if(hint) hint.textContent = `缩放 ${Math.round(CV.scale*100)}%`;
  // 实时同步计数（cvPaint 是画布唯一渲染出口，安全）
  const cn = document.getElementById('cvCountN');
  const ce = document.getElementById('cvCountE');
  if(cn) cn.textContent = state.canvas.nodes.length + ' 个节点';
  if(ce) ce.textContent = state.canvas.edges.length + ' 条连线';
}

/* ---------- 画布视口控制（缩放 / 居中 / 重置） ---------- */
/* 视口中心像素坐标 —— 用于「以中心为锚点」缩放 */
function cvViewCenter(){
  const wrap = document.getElementById('cvWrap');
  if(!wrap) return {x:0, y:0};
  const r = wrap.getBoundingClientRect();
  return {x: r.width/2, y: r.height/2};
}
/* 以 (mx,my) 为锚点缩放：缩放前后该点对应的画布坐标保持不变 */
function cvZoomAt(factor, mx, my){
  const old = CV.scale;
  const next = Math.min(2.4, Math.max(0.3, old * factor));
  if(next === old) return;
  CV.tx = mx - (mx - CV.tx) * (next/old);
  CV.ty = my - (my - CV.ty) * (next/old);
  CV.scale = next;
  cvPaint();
}
/* 把全部节点居中（保持当前 scale） */
function cvCenter(){
  const wrap = document.getElementById('cvWrap');
  const ns = state.canvas.nodes;
  if(!wrap) return;
  if(!ns.length){ CV.tx = 24; CV.ty = 24; cvPaint(); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  ns.forEach(n=>{
    const s = cvNodeSize(n);
    x0 = Math.min(x0, n.x);        y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + s.w);  y1 = Math.max(y1, n.y + s.h);
  });
  const r = wrap.getBoundingClientRect();
  CV.tx = (r.width  - (x1 - x0) * CV.scale) / 2 - x0 * CV.scale;
  CV.ty = (r.height - (y1 - y0) * CV.scale) / 2 - y0 * CV.scale;
  cvPaint();
}
/* 重置：回到 100% 并居中（与按钮 title「恢复到 100% 并居中」一致） */
function cvResetView(){ CV.scale = 1; cvCenter(); }

function cvBind(){
  const wrap = document.getElementById('cvWrap');
  if(!wrap || wrap.dataset.bound) return;
  wrap.dataset.bound = '1';

  wrap.querySelectorAll('.cvn').forEach(()=>{});
  wrap.addEventListener('pointerdown', e=>{
    /* 必须放行画布浮层控件（＋ / － / 重置）：
       wrap.setPointerCapture() 会把随后的 click 事件重定向到 wrap 本身，
       按钮永远收不到点击 —— 表现为「按了没反应」。 */
    if(e.target.closest('button')) return;
    const nodeEl = e.target.closest('.cvn');
    if(nodeEl){
      const id = nodeEl.dataset.id;
      if(wrap.dataset.connect==='1'){
        if(CV.sel && CV.sel!==id){
          state.canvas.edges.push([CV.sel, id]);
          CV.sel = null; wrap.dataset.connect='0';
          saveData(); cvPaint(); toast('已连线');
        }else{
          CV.sel = id; cvPaint(); toast('已选择起点，再点一个节点');
        }
        return;
      }
      if(e.detail===2){ cvEditText(id); return; }
      const n = cvNodeById(id);
      CV.drag = {id, sx:e.clientX, sy:e.clientY, ox:n.x, oy:n.y, moved:false};
      wrap.setPointerCapture(e.pointerId);
      return;
    }
    CV.panning = true;
    CV.panStart = {x:e.clientX, y:e.clientY, tx:CV.tx, ty:CV.ty};
    wrap.style.cursor = 'grabbing';
    wrap.setPointerCapture(e.pointerId);
  });

  wrap.addEventListener('pointermove', e=>{
    if(CV.drag){
      const n = cvNodeById(CV.drag.id);
      if(!n) return;
      const nx = CV.drag.ox + (e.clientX-CV.drag.sx)/CV.scale;
      const ny = CV.drag.oy + (e.clientY-CV.drag.sy)/CV.scale;
      if(Math.abs(e.clientX-CV.drag.sx)>2 || Math.abs(e.clientY-CV.drag.sy)>2) CV.drag.moved = true;
      n.x = Math.round(nx/14)*14;   // 吸附对齐网格
      n.y = Math.round(ny/14)*14;
      cvPaint();
    }else if(CV.panning){
      CV.tx = CV.panStart.tx + (e.clientX-CV.panStart.x);
      CV.ty = CV.panStart.ty + (e.clientY-CV.panStart.y);
      cvPaint();
    }
  });

  const end = e=>{
    if(CV.drag){
      if(CV.drag.moved){ saveData(); } else { CV.sel = CV.drag.id; }
      CV.drag = null;
    }
    if(CV.panning){ CV.panning = false; wrap.style.cursor='grab'; }
  };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);

  wrap.addEventListener('wheel', e=>{
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    cvZoomAt(e.deltaY<0 ? 1.12 : 0.89, e.clientX - rect.left, e.clientY - rect.top);
  }, {passive:false});
}

function cvEditText(id){
  const n = cvNodeById(id);
  if(!n) return;
  const v = prompt('编辑节点文字（换行请用 \\n）：', n.text);
  if(v===null) return;
  n.text = v.replace(/\\n/g,'\n');
  saveData(); cvPaint();
}

/* ---------- 一键生成：阶段思维导图 ---------- */
function genStageMap(stageKey){
  const st = STAGES.find(s=>s.key===stageKey);
  if(!st) return;
  const colorIdx = STAGES.indexOf(st);
  const nodes = [];
  const edges = [];
  const rootId = 'n'+Date.now().toString(36)+'r';
  nodes.push({id:rootId, x:0, y:0, w:214, text:st.name, type:'root', color:colorIdx});
  st.tasks.forEach((t,i)=>{
    const id = 'n'+Date.now().toString(36)+i;
    nodes.push({id, x:0, y:0, w:214, text:t, type:'leaf', color:colorIdx});
    edges.push([rootId, id]);
  });
  const g = state.targets.filter(x=>x.stage===stageKey);
  g.forEach((x,i)=>{
    const id = 'n'+Date.now().toString(36)+'g'+i;
    nodes.push({id, x:0, y:0, w:224, text:'✅ '+x.title+(x.res?'\\n产出：'+x.res:''), type:'branch', color:colorIdx});
    edges.push([rootId, id]);
  });
  state.canvas.nodes = nodes;
  state.canvas.edges = edges;
  layoutAuto();
  CV.scale = 1; CV.tx = 10; CV.ty = 10;
  saveData(); cvPaint(); layoutFit();
  toast('已生成「'+st.name+'」思维导图');
}

/* ---------- 一键生成：求职流程框图 ---------- */
function genFlow(){
  const steps = [
    ['能力盘点','✓ 已完成','#2F855A'],
    ['话术准备 D0','12 处断言打磨','#2C6E9B'],
    ['S1 筑基 D1–5','FastAPI·Docker·Redis','#2C6E9B'],
    ['S2 检索 D6–11','RAG 全链路·分块·混合检索','#2F855A'],
    ['S3 Agent D12–16','FunctionCalling·LangGraph·MCP','#6B46C1'],
    ['S4 收尾 D17–21','评测·作品集·简历3.0','#993C1D'],
    ['定向投递','杭州 8–11K · AI应用/RAG/Python','#993C1D']
  ];
  const nodes = [], edges = [];
  /* 蛇形排布：每行 4 个，奇偶行反向，连接线最短 */
  const PER = 4, SX = 300, SY = 150;
  steps.forEach((s,i)=>{
    const id = 'f'+Date.now().toString(36)+i;
    const r = Math.floor(i/PER), k = i % PER;
    const cx = (r % 2 === 0) ? k : (PER - 1 - k);
    nodes.push({id, x:60+cx*SX, y:130+r*SY, w:214, text:s[0]+'\n'+s[1],
      type: i===0?'root':(i===steps.length-1?'root':'branch'),
      color: PALETTE.indexOf(s[2])>=0?PALETTE.indexOf(s[2]):i%5});
    if(i>0) edges.push([nodes[i-1].id, id]);
  });
  state.canvas.nodes = nodes;
  state.canvas.edges = edges;
  saveData(); cvPaint(); layoutFit();
  toast('已生成求职流程框图（共 '+nodes.length+' 节点）');
}

/* ---------- 一键生成：由 21 天计划生成全图 ---------- */
function genFromPlan(){
  const nodes = [], edges = [];
  const rootId = 'p'+Date.now().toString(36)+'root';
  nodes.push({id:rootId, x:0, y:0, w:214, text:'AI 转型 21 天\n目标：杭州 8–11K', type:'root', color:0});
  STAGES.forEach((s,i)=>{
    const sid = 'p'+Date.now().toString(36)+'s'+i;
    nodes.push({id:sid, x:0, y:0, w:214, text:s.name+'\n'+s.days+' · '+s.focus, type:'branch', color:i});
    edges.push([rootId, sid]);
    s.tasks.slice(0,4).forEach((t,j)=>{
      const tid = 'p'+Date.now().toString(36)+'t'+i+'_'+j;
      nodes.push({id:tid, x:0, y:0, w:214, text:t, type:'leaf', color:i});
      edges.push([sid, tid]);
    });
  });
  state.canvas.nodes = nodes;
  state.canvas.edges = edges;
  layoutAuto();
  saveData(); cvPaint(); layoutFit();
  toast('已由 21 天计划生成完整网状图（'+nodes.length+' 节点）');
}

function layoutFit(){
  const wrap = document.getElementById('cvWrap');
  if(!wrap || !state.canvas.nodes.length) return;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  state.canvas.nodes.forEach(n=>{
    const s = cvNodeSize(n);
    minX = Math.min(minX,n.x); minY = Math.min(minY,n.y);
    maxX = Math.max(maxX,n.x+s.w); maxY = Math.max(maxY,n.y+s.h);
  });
  const pad = 44;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const z = Math.min((W-pad*2)/(maxX-minX), (H-pad*2)/(maxY-minY));
  // 设下限，避免图太大时缩到不可读（宁可溢出可分页拖拽，也不要看不清）
  CV.scale = Math.max(0.6, Math.min(z, 1.5));
  const cw = (maxX-minX)*CV.scale, ch = (maxY-minY)*CV.scale;
  CV.tx = pad - minX*CV.scale + Math.max(0,(W-pad*2-cw))/2;
  CV.ty = pad - minY*CV.scale + Math.max(0,(H-pad*2-ch))/2;
  cvPaint();
}

/* ---------- 导出 SVG / PNG ---------- */
function cvBuildSVG(){
  const nodes = state.canvas.nodes;
  if(!nodes.length) return null;
  const idMap = {}; nodes.forEach(n=>idMap[n.id]=n);
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  nodes.forEach(n=>{
    const s = cvNodeSize(n);
    minX=Math.min(minX,n.x); minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+s.w); maxY=Math.max(maxY,n.y+s.h);
  });
  const pad = 40;
  const W = Math.ceil(maxX-minX+pad*2), H = Math.ceil(maxY-minY+pad*2);
  let body = '';
  state.canvas.edges.forEach(e=>{
    const a = idMap[e[0]], b = idMap[e[1]];
    if(!a||!b) return;
    body += `<path d="${cvPath(a,b)}" fill="none" stroke="#C9BEB6" stroke-width="1.8" marker-end="url(#arw)"/>`;
  });
  nodes.forEach(n=>{
    const s = cvNodeSize(n);
    const c = PALETTE[(n.color||0)%PALETTE.length];
    const isRoot = n.type==='root';
    const isLeaf = n.type==='leaf';
    const lines = cvMetrics(n).lines;
    body += `<g><rect x="${n.x}" y="${n.y}" width="${s.w}" height="${s.h}" rx="${isRoot?12:9}"
      fill="${isRoot?c:(isLeaf?'#FFFFFF':c+'14')}" stroke="${c}" stroke-width="${isRoot?2:1.5}"/>`;
    lines.forEach((l,i)=>{
      body += `<text x="${n.x+15}" y="${n.y+21+i*19}" font-size="${i===0?12.5:11.5}" font-weight="${i===0&&(isRoot||!isLeaf)?650:500}"
        fill="${isRoot ? (i===0?'#FFFFFF':'#F1EDEA') : (i===0?c:'#5A514A')}"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">${esc(l)}</text>`;
    });
    body += '</g>';
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${minX-pad} ${minY-pad} ${W} ${H}">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="#C9BEB6"/></marker></defs>
<rect x="${minX-pad}" y="${minY-pad}" width="${W}" height="${H}" fill="#FAF8F6"/>
${body}</svg>`;
}

function download(name, content, mime){
  const blob = new Blob([content], {type:mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

function exportSVG(){
  const svg = cvBuildSVG();
  if(!svg) return toast('画布是空的，先生成一张图');
  download('mindmap.svg', svg, 'image/svg+xml');
  toast('SVG 已导出，可直接贴进 Markdown / 文档');
}

function exportPNG(){
  const svg = cvBuildSVG();
  if(!svg) return toast('画布是空的，先生成一张图');
  const img = new Image();
  const blob = new Blob([svg], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  img.onload = ()=>{
    const cv = document.createElement('canvas');
    const sc = 2;
    cv.width = img.width*sc; cv.height = img.height*sc;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#FAF8F6'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(b=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'mindmap.png';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
      toast('PNG 已导出（2 倍分辨率）');
    });
  };
  img.onerror = ()=>{ toast('PNG 导出失败，请用 SVG 导出'); URL.revokeObjectURL(url); };
  img.src = url;
}

/* =======================================================================
   统一刷新入口（唯一调度点）
   ======================================================================= */
function refreshAll(){
  renderNav();
  renderTop();
  const R = {
    today: renderToday, kanban: renderKanban, sprint: renderSprint, plan: renderPlan,
    res: renderRes, jdmap: renderJdmap, canvas: renderCanvas, profile: renderProfile
  };
  (R[VIEW] || renderToday)();

/* =======================================================================
   事件处理（只改数据 + 调 refreshAll，禁止在渲染函数内互调）
   ======================================================================= */
function go(v){ VIEW = v; refreshAll(); window.scrollTo({top:0,behavior:'smooth'}); }
function toast(msg){
  const t = $('#toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1900);
}
function moveTarget(id, col){
  const g = state.targets.find(x=>x.id===id);
  if(!g || g.status===col) return;
  g.status = col;
  saveData(); refreshAll();
}
function toggleTarget(id){
  const g = state.targets.find(x=>x.id===id);
  if(!g) return;
  g.status = g.status==='done' ? 'todo' : 'done';
  saveData(); refreshAll();
}
function doneTask(id){
  const k = state.tasks.find(x=>x.id===id);
  if(!k) return;
  k.status = 'done'; saveData(); refreshAll();
  toast('已完成一条');
}
function delTask(id){
  state.tasks = state.tasks.filter(x=>x.id!==id);
  saveData(); refreshAll();
}
function clearDoneTasks(){
  state.tasks = state.tasks.filter(x=>x.status!=='done');
  saveData(); refreshAll(); toast('已清除');
}
/* ---------- 冲刺 / JD 映射 / 主题 ---------- */
function toggleSprint(id){
  const x = (state.sprint||[]).find(i=>i.id===id);
  if(!x) return;
  x.done = !x.done;
  saveData(); refreshAll();
  toast(x.done ? ('已完成 '+x.day+'：'+x.out) : ('已恢复 '+x.day));
}
function resetSprint(){
  if(!confirm('把所有 14 天冲刺项重置为未完成？已产出的文件不会消失，只是清单进度归零。')) return;
  (state.sprint||[]).forEach(x=>{ x.done = false; });
  saveData(); refreshAll(); toast('冲刺清单已重置');
}
function cycleJd(id){
  const j = (state.jdmap||[]).find(x=>x.id===id);
  if(!j) return;
  const seq = ['green','blue','red'];
  j.ready = seq[(seq.indexOf(j.ready)+1) % seq.length];
  saveData(); refreshAll();
}
function setTheme(mode){
  document.body.setAttribute('data-theme', mode);
  const txt = document.getElementById('themeTxt');
  if(txt) txt.textContent = mode==='dark' ? '暗色模式' : '亮色模式';
  try{ localStorage.setItem(LS_KEY+'_theme', mode); }catch(e){}
}
function addTask(){
  const t = prompt('新待办内容：');
  if(!t || !t.trim()) return;
  state.tasks.push({id:uid('k'), title:t.trim(), pri:'P1', status:'todo', due:todayStr(), src:'临时添加'});
  saveData(); refreshAll(); toast('已添加');
}
function addTarget(){
  const t = prompt('新目标内容（要求：可验收的产出物）：');
  if(!t || !t.trim()) return;
  const stage = prompt('属于哪个阶段？\n'+STAGES.map(s=>s.key).join(' / '), 'S1 筑基');
  const pri = prompt('优先级？（P0 / P1 / P2）','P1');
  state.targets.push({
    id:uid('g'), title:t.trim(), stage:(STAGES.find(s=>s.key===stage)?stage:'S1 筑基'),
    pri:(['P0','P1','P2'].includes(pri)?pri:'P1'), status:'todo',
    due:dateAdd(todayStr(),7), res:''
  });
  saveData(); refreshAll(); toast('已新建目标');
}
function toggleRes(id){
  const r = state.resources.find(x=>x.id===id);
  if(!r) return;
  r.done = !r.done; saveData(); refreshAll();
}
function addNode(){
  const t = prompt('节点文字（换行用 \\n）：','新节点');
  if(t===null) return;
  state.canvas.nodes.push({id:uid('n'), x:120, y:120, w:214, text:t.replace(/\\n/g,'\n'), type:'branch', color:state.canvas.nodes.length%5});
  saveData(); cvPaint(); toast('已添加节点');
}

/* 事件委托（一次绑定，全局生效） */
document.addEventListener('click', e=>{
  const btn = e.target.closest('[data-act]');
  if(btn){ onAction(btn.dataset.act, btn, e); return; }
  const nv = e.target.closest('nav [data-view]');
  if(nv) go(nv.dataset.view);
});

function onAction(act, btn, e){
  const id = btn.dataset.id;
  switch(act){
    case 'addTask': addTask(); break;
    case 'addTarget': addTarget(); break;
    case 'doneTask': doneTask(id); break;
    case 'delTask': delTask(id); break;
    case 'clearDoneTasks': clearDoneTasks(); break;
    case 'doneSprint': toggleSprint(id); break;
    case 'resetSprint': resetSprint(); break;
    case 'cycleJd': cycleJd(id); break;
    case 'doneTarget': toggleTarget(id); break;
    case 'doneRes': toggleRes(id); break;
    case 'go': go(btn.dataset.view); break;
    case 'filterRes': RES_FILTER = btn.dataset.k; renderRes(); renderTop(); break;
    case 'toggleAllRes': {
      const allDone = state.resources.every(r=>r.done);
      state.resources.forEach(r=>r.done = !allDone);
      saveData(); refreshAll(); toast(allDone?'已全部展开':'已全部标记完成');
      break;
    }
    case 'addNode': addNode(); break;
    case 'layout': layoutFit(); toast('已适应窗口'); break;
    case 'fit': layoutFit(); break;
    case 'zin':    { const c = cvViewCenter(); cvZoomAt(1.18, c.x, c.y); break; }
    case 'zout':   { const c = cvViewCenter(); cvZoomAt(0.85, c.x, c.y); break; }
    case 'zreset': cvResetView(); toast('画布视图已重置'); break;
    case 'connectMode': {
      const w = document.getElementById('cvWrap');
      if(w){ w.dataset.connect = w.dataset.connect==='1' ? '0' : '1'; }
      toast(w && w.dataset.connect==='1' ? '连线模式：依次点两个节点' : '已退出连线模式');
      break;
    }
    case 'genStage': genStageMap(btn.dataset.k); break;
    case 'genFlow': genFlow(); break;
    case 'genFromPlan': genFromPlan(); break;
    case 'genMap': genFromPlan(); break;
    case 'exportSVG': exportSVG(); break;
    case 'exportPNG': exportPNG(); break;
    case 'clearCanvas': {
      if(!confirm('确定清空画布上的所有节点与连线？此操作不可撤销。')) return;
      state.canvas.nodes = []; state.canvas.edges = [];
      saveData(); cvPaint(); toast('画布已清空');
      break;
    }
  }
}

/* 备份 / 恢复 */
function exportJSON(){
  const payload = {app:'career-ops-workspace', exportedAt:new Date().toISOString(), data:state};
  download('AI转型作战台-备份-'+todayStr()+'.json', JSON.stringify(payload,null,2), 'application/json');
  toast('已导出备份文件');
}
function importJSON(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const p = JSON.parse(fr.result);
      const d = p.data || p;
      if(!d || typeof d !== 'object') throw new Error('格式错误');
      if(!confirm('导入将覆盖当前数据（'+(state.targets.length+state.tasks.length+state.resources.length)+' 条记录）。继续？')) return;
      state = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), d);
      if(!state.canvas || !state.canvas.nodes) state.canvas = {nodes:[],edges:[],view:{x:0,y:0,z:1}};
      saveData(); refreshAll(); toast('导入成功，共恢复 '+(state.targets.length+state.tasks.length+state.resources.length)+' 条记录');
    }catch(err){ alert('导入失败：文件格式不正确（'+err.message+'）'); }
  };
  fr.readAsText(file);
}

/* =======================================================================
   启动（防御性初始化：加载数据 → 定状态 → 一次性 refreshAll）
   ======================================================================= */
function boot(){
  loadData();
  if(!state.targets.length && !state.skipExample){ /* 保留空态，不强制重置 */ }

  /* 主题：默认暗色（ADHD / INTP 取向），用户选择持久化 */
  let th = 'dark';
  try{ th = localStorage.getItem(LS_KEY+'_theme') || 'dark'; }catch(e){}
  setTheme(th);

  VIEW = 'today';
  refreshAll();

  const bth = $('#btnTheme');
  if(bth) bth.addEventListener('click', ()=>{
    setTheme(document.body.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
  });

  $('#btnExport').addEventListener('click', exportJSON);
  $('#btnImport').addEventListener('click', ()=>$('#fileImport').click());
  $('#fileImport').addEventListener('change', ev=>{
    const f = ev.target.files && ev.target.files[0];
    if(f) importJSON(f);
    ev.target.value = '';
  });

  // 窗口尺寸变化：画布自适应重绘（不在渲染链内互调）
  let rz = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(rz);
    rz = setTimeout(()=>{ if(VIEW==='canvas') cvPaint(); }, 180);
  });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
